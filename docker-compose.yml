services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb-importer-db
    ports:
      - "6379:6379"
      - "3001:3001"
    volumes:
      - falkordb-data:/data
    environment:
      - FALKORDB_ARGS=--port 6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: falkordb-importer-backend
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: falkordb-importer-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkordb-data:
